spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/notifications}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

notification.jwt.secret=${NOTIFICATION_JWT_SECRET}
notification.jwt.ttl-minutes=480
notification.dispatch.poll-ms=500
notification.dispatch.workers=4
notification.dispatch.queue-capacity=100
notification.dispatch.tenant-burst=5
notification.bootstrap.admin-email=${BOOTSTRAP_ADMIN_EMAIL:platform@example.com}
notification.bootstrap.admin-password=${BOOTSTRAP_ADMIN_PASSWORD:change-me-now}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
